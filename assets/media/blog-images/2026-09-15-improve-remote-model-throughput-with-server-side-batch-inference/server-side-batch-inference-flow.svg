<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Server-side batch inference request flow</title>
  <desc id="diagram-description">An ingest model applies size-based splitting to a multi-text request. A separate search model first queues compatible requests and then applies the same size-based splitting. Both models can use the same connector and remote model endpoint.</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 16px Arial, sans-serif; fill: #40566d; }
      .lane-title { font: 700 15px Arial, sans-serif; fill: #40566d; letter-spacing: 1px; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #17324d; }
      .box-text { font: 14px Arial, sans-serif; fill: #40566d; }
      .code-text { font: 700 14px "Courier New", monospace; fill: #8a4b08; }
      .note { font: 14px Arial, sans-serif; fill: #40566d; font-style: italic; }
      .arrow { stroke: #40566d; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .lane { stroke-width: 1.5; rx: 16; }
      .caller { fill: #e9f2fb; stroke: #3178a8; stroke-width: 2; rx: 12; }
      .model { fill: #fff5df; stroke: #c97812; stroke-width: 2; rx: 12; }
      .batch { fill: #e5f6f3; stroke: #138579; stroke-width: 2; rx: 12; }
      .connector { fill: #f0eafa; stroke: #7654a6; stroke-width: 2; rx: 12; }
      .endpoint { fill: #e8eef5; stroke: #17324d; stroke-width: 2; rx: 12; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#40566d"/>
    </marker>
  </defs>

  <rect width="1400" height="640" fill="#ffffff"/>
  <text x="700" y="42" text-anchor="middle" class="title">Server-side batch inference request flow</text>
  <text x="700" y="72" text-anchor="middle" class="subtitle">
    <tspan class="code-text">batch_inference_config</tspan>
    <tspan> is stored on each registered model record, not on the connector</tspan>
  </text>

  <rect x="20" y="98" width="1360" height="214" fill="#f6f9fc" stroke="#c8d5e2" class="lane"/>
  <text x="42" y="128" class="lane-title">INGEST PATH</text>

  <rect x="42" y="154" width="188" height="96" class="caller"/>
  <text x="136" y="185" text-anchor="middle" class="box-title">Ingest processor</text>
  <text x="136" y="212" text-anchor="middle" class="box-text">One multi-text</text>
  <text x="136" y="232" text-anchor="middle" class="box-text">prediction request</text>

  <path d="M230 202 H280" class="arrow"/>

  <rect x="280" y="138" width="286" height="128" class="model"/>
  <text x="423" y="168" text-anchor="middle" class="box-title">Ingest model record</text>
  <text x="423" y="195" text-anchor="middle" class="code-text">batch_inference_config</text>
  <text x="423" y="220" text-anchor="middle" class="box-text">Item and byte limits</text>
  <text x="423" y="243" text-anchor="middle" class="box-text">Queue omitted or disabled</text>

  <path d="M566 202 H646" class="arrow"/>

  <rect x="646" y="154" width="224" height="96" class="batch"/>
  <text x="758" y="184" text-anchor="middle" class="box-title">Size-based splitter</text>
  <text x="758" y="211" text-anchor="middle" class="box-text">Keeps every remote call</text>
  <text x="758" y="231" text-anchor="middle" class="box-text">within both limits</text>

  <path d="M870 202 H1038 V294 H1088" class="arrow"/>
  <text x="758" y="286" text-anchor="middle" class="note">Sub-batches run concurrently; outputs return in input order</text>

  <rect x="20" y="330" width="1360" height="230" fill="#f5fbf9" stroke="#bfddd7" class="lane"/>
  <text x="42" y="360" class="lane-title">SEARCH PATH</text>

  <rect x="42" y="392" width="188" height="96" class="caller"/>
  <text x="136" y="423" text-anchor="middle" class="box-title">Search requests</text>
  <text x="136" y="450" text-anchor="middle" class="box-text">One or a few texts</text>
  <text x="136" y="470" text-anchor="middle" class="box-text">from each caller</text>

  <path d="M230 440 H280" class="arrow"/>

  <rect x="280" y="376" width="286" height="128" class="model"/>
  <text x="423" y="406" text-anchor="middle" class="box-title">Search model record</text>
  <text x="423" y="433" text-anchor="middle" class="code-text">batch_inference_config</text>
  <text x="423" y="458" text-anchor="middle" class="box-text">Item and byte limits</text>
  <text x="423" y="481" text-anchor="middle" class="box-text">Queue enabled</text>

  <path d="M566 440 H608" class="arrow"/>

  <rect x="608" y="392" width="200" height="96" class="batch"/>
  <text x="708" y="422" text-anchor="middle" class="box-title">Request queue</text>
  <text x="708" y="449" text-anchor="middle" class="box-text">Briefly collects</text>
  <text x="708" y="469" text-anchor="middle" class="box-text">compatible requests</text>

  <path d="M808 440 H842" class="arrow"/>

  <rect x="842" y="392" width="200" height="96" class="batch"/>
  <text x="942" y="422" text-anchor="middle" class="box-title">Size-based splitter</text>
  <text x="942" y="449" text-anchor="middle" class="box-text">Splits each queue flush</text>
  <text x="942" y="469" text-anchor="middle" class="box-text">by item and byte limits</text>

  <path d="M1042 440 H1062 V346 H1088" class="arrow"/>
  <text x="825" y="532" text-anchor="middle" class="note">Each result is routed back to the caller that supplied the text</text>

  <rect x="1088" y="262" width="150" height="116" class="connector"/>
  <text x="1163" y="306" text-anchor="middle" class="box-title">Shared</text>
  <text x="1163" y="330" text-anchor="middle" class="box-title">connector</text>
  <text x="1163" y="354" text-anchor="middle" class="box-text">Request mapping</text>

  <path d="M1238 320 H1270" class="arrow"/>

  <rect x="1270" y="275" width="108" height="90" class="endpoint"/>
  <text x="1324" y="305" text-anchor="middle" class="box-title">Remote</text>
  <text x="1324" y="329" text-anchor="middle" class="box-title">model</text>
  <text x="1324" y="350" text-anchor="middle" class="box-text">endpoint</text>

  <text x="700" y="604" text-anchor="middle" class="subtitle">Separate model IDs let ingest use splitting alone while search adds queueing.</text>
</svg>
